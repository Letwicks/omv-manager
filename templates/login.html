<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMV Manager - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1e1e2e; display: flex; align-items: center; min-height: 100vh; }
    .card { background: #181825; border: 1px solid #313244; width: 100%; max-width: 400px; }
    .card-header { background: #11111b; border-bottom: 1px solid #313244; }
    .form-control { background: #313244; border: 1px solid #45475a; color: #cdd6f4; }
    .form-control:focus { background: #313244; border-color: #89b4fa; box-shadow: 0 0 0 0.2rem rgba(137,180,250,0.25); }
    .btn-primary { background: #89b4fa; border: none; color: #11111b; font-weight: bold; }
    .btn-primary:hover { background: #74c7ec; }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center">
    <div class="card">
      <div class="card-header text-center text-light">
        <h5 class="mb-0">OMV Manager</h5>
        <small class="text-secondary">Acesso ao painel</small>
      </div>
      <div class="card-body">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endwith %}
        <form method="post">
          <div class="mb-3">
            <label class="form-label text-light">Senha</label>
            <input type="password" name="senha" class="form-control" placeholder="senha configurada no servidor" required autofocus>
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
